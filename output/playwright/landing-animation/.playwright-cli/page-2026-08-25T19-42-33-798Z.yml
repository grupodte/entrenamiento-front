            - generic:
              - paragraph: "\"Un cliente con toda la motivación del mundo me escribió a las tres semanas: 'Lo dejo.' No porque el plan fuera malo. Una semana complicada en el trabajo, se desmoronó, y no había nadie que le dijera qué hacer. Se cayó. No pudo levantarse solo."
