              - paragraph: Yo viví lo mismo años. Seguía planes de internet, arrancaba fuerte, una complicación llegaba y no había nadie. Me perdía. De nuevo. Y de nuevo. Eso no es debilidad. Es lo que pasa cuando no tenés un coach.
              - paragraph: "Cambié. Dejé de mandar PDFs y desaparecer. Ahora estoy presente 60 días: ajustando, respondiendo, acompañando en tiempo real. Los resultados de mis clientes dejaron de ser la excepción. Son la norma.\""
